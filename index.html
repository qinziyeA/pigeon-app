<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鸽棚血统管理</title>
<style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#222;color:#fff;padding:14px;font-size:22px;font-weight:bold}
main{max-width:1000px;margin:auto;padding:10px}
.card{background:#fff;padding:12px;margin:10px 0;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
input,textarea,select,button{font-size:16px;box-sizing:border-box}
input,textarea,select{width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:6px}
textarea{min-height:60px}
button{padding:9px 12px;margin:4px 2px;background:#222;color:#fff;border:none;border-radius:6px;cursor:pointer}
button.gray{background:#666}
button.red{background:#b3261e}
button.light{background:#e6e6e6;color:#222}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tree{overflow-x:auto}
.treeRow{display:flex;gap:8px;margin:8px 0;min-width:760px}
.box{border:1px solid #ccc;border-radius:8px;padding:8px;flex:1;background:#fafafa;min-height:78px}
.ring{color:#c23b22;font-weight:bold}
.small{font-size:13px;color:#555;white-space:pre-wrap}
.listItem{border:1px solid #ddd;border-radius:8px;padding:8px;margin:6px 0;background:#fafafa}
.muted{color:#777;font-size:14px}
label{font-size:14px;color:#555}
@media(max-width:700px){.row{grid-template-columns:1fr}.treeRow{min-width:720px}header{font-size:20px}}
</style>
</head>
<body>
<header>鸽棚血统管理</header>
<main>

<div class="card">
  <h3>查询</h3>
  <input id="search" placeholder="输入足环号 / 名字 / 成绩关键词">
  <button onclick="queryBird()">查询</button>
  <button class="light" onclick="clearSearch()">清空查询</button>
</div>

<div class="card">
  <h3>查询结果 / 当前查看</h3>
  <div id="result">暂无数据</div>
</div>

<div class="card">
  <h3>血统图</h3>
  <div id="tree" class="tree">暂无血统图</div>
</div>

<div class="card">
  <h3 id="formTitle">新增鸽子</h3>
  <input type="hidden" id="editingRing">
  <div class="row">
    <div><label>足环号（必填）</label><input id="ring" placeholder="例如 CHN2023-01-1668850"></div>
    <div><label>名字/昵称</label><input id="name" placeholder="例如 冠军鸽"></div>
    <div><label>性别</label><select id="gender"><option value="">不明</option><option>雄</option><option>雌</option></select></div>
    <div><label>出生年份</label><input id="year" placeholder="例如 2023"></div>
    <div><label>羽色</label><input id="color" placeholder="例如 灰、雨点、红轮"></div>
    <div><label>眼色/眼砂</label><input id="eye" placeholder="例如 黄眼、砂眼"></div>
    <div><label>父亲足环号</label><input id="father" placeholder="父亲足环号"></div>
    <div><label>母亲足环号</label><input id="mother" placeholder="母亲足环号"></div>
  </div>
  <label>成绩 / 血统说明</label>
  <textarea id="achievement" placeholder="例如 500公里冠军、某名鸽直子等"></textarea>
  <label>备注</label>
  <textarea id="note" placeholder="其他说明"></textarea>
  <button onclick="saveBird()">保存</button>
  <button class="light" onclick="clearForm()">清空表单</button>
</div>

<div class="card">
  <h3>鸽子列表</h3>
  <div id="count" class="muted"></div>
  <div id="list"></div>
</div>

</main>

<script>
var birds = {};
var currentRing = "";
try { birds = JSON.parse(localStorage.getItem("birds") || "{}"); } catch(e) { birds = {}; }

function save(){ localStorage.setItem("birds", JSON.stringify(birds)); }
function v(id){ return document.getElementById(id).value.trim(); }
function setv(id,val){ document.getElementById(id).value = val || ""; }
function get(r){ return birds[r] || null; }
function esc(s){ return String(s||"").replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function textOf(b,ring){ return [ring,b.name,b.gender,b.year,b.color,b.eye,b.father,b.mother,b.achievement,b.note].join(" ").toLowerCase(); }

function saveBird(){
  var oldRing = v("editingRing");
  var ring = v("ring");
  if(!ring){ alert("请输入足环号"); return; }
  if(oldRing && oldRing !== ring && birds[ring]){ alert("这个足环号已经存在"); return; }
  if(!oldRing && birds[ring]){
    if(!confirm("这个足环号已经存在，要覆盖吗？")){ return; }
  }
  var b = {
    name:v("name"), gender:v("gender"), year:v("year"), color:v("color"), eye:v("eye"),
    father:v("father"), mother:v("mother"), achievement:v("achievement"), note:v("note")
  };
  if(oldRing && oldRing !== ring){ delete birds[oldRing]; }
  birds[ring] = b;
  currentRing = ring;
  save();
  clearForm();
  setv("search", ring);
  renderAll();
  alert("已保存：" + ring);
}

function queryBird(){
  var q = v("search").toLowerCase();
  if(!q){ alert("请输入足环号或关键词"); return; }
  var exact = birds[v("search")];
  if(exact){ currentRing = v("search"); renderAll(); return; }
  var keys = Object.keys(birds);
  for(var i=0;i<keys.length;i++){
    var r = keys[i];
    if(textOf(birds[r],r).indexOf(q) >= 0){ currentRing = r; renderAll(); return; }
  }
  document.getElementById("result").innerHTML = "未找到";
  document.getElementById("tree").innerHTML = "暂无血统图";
}

function clearSearch(){ setv("search",""); }
function jump(r){ if(!r){return;} setv("search",r); currentRing=r; renderAll(); }
function editBird(r){
  var b=get(r); if(!b){return;}
  document.getElementById("formTitle").innerHTML="修改鸽子";
  setv("editingRing",r); setv("ring",r); setv("name",b.name); setv("gender",b.gender); setv("year",b.year);
  setv("color",b.color); setv("eye",b.eye); setv("father",b.father); setv("mother",b.mother);
  setv("achievement",b.achievement); setv("note",b.note);
  window.scrollTo({top:document.getElementById("formTitle").offsetTop-10,behavior:"smooth"});
}
function deleteBird(r){
  if(!confirm("确定删除 " + r + " 吗？")){ return; }
  delete birds[r];
  if(currentRing === r){ currentRing = Object.keys(birds)[0] || ""; }
  save(); renderAll();
}
function clearForm(){
  document.getElementById("formTitle").innerHTML="新增鸽子";
  ["editingRing","ring","name","gender","year","color","eye","father","mother","achievement","note"].forEach(function(id){setv(id,"");});
}

function birdLink(r){
  if(!r){ return "-"; }
  if(birds[r]){ return "<a href='#' onclick='jump(\""+esc(r)+"\")'>"+esc(r)+"</a>"; }
  return esc(r) + " <span class='muted'>（未录入）</span>";
}
function renderResult(){
  var b = get(currentRing);
  if(!b){ document.getElementById("result").innerHTML="暂无数据"; return; }
  document.getElementById("result").innerHTML =
    "<div><span class='ring'>"+esc(currentRing)+"</span> "+esc(b.name)+"</div>"+
    "<div>性别："+esc(b.gender||"-")+"　年份："+esc(b.year||"-")+"　羽色："+esc(b.color||"-")+"　眼色："+esc(b.eye||"-")+"</div>"+
    "<div>父："+birdLink(b.father)+"　母："+birdLink(b.mother)+"</div>"+
    "<div class='small'>成绩："+esc(b.achievement||"-")+"</div>"+
    "<div class='small'>备注："+esc(b.note||"-")+"</div>"+
    "<button onclick='editBird(\""+esc(currentRing)+"\")'>修改这只</button>"+
    "<button class='red' onclick='deleteBird(\""+esc(currentRing)+"\")'>删除这只</button>";
}
function box(title,r){
  var b = get(r);
  if(!r){ return "<div class='box'><b>"+title+"</b><br><span class='muted'>未填写</span></div>"; }
  if(!b){ return "<div class='box'><b>"+title+"</b><br><span class='ring'>"+esc(r)+"</span><br><span class='muted'>未录入资料</span></div>"; }
  return "<div class='box' onclick='jump(\""+esc(r)+"\")'><b>"+title+"</b><br><span class='ring'>"+esc(r)+"</span><br>"+esc(b.name||"")+" "+esc(b.gender||"")+"<div class='small'>"+esc([b.color,b.eye,b.achievement].filter(Boolean).join("\n"))+"</div></div>";
}
function renderTree(){
  var b=get(currentRing);
  if(!b){ document.getElementById("tree").innerHTML="暂无血统图"; return; }
  var f=get(b.father), m=get(b.mother);
  var html = "";
  html += "<div class='treeRow'>"+box("本鸽",currentRing)+"</div>";
  html += "<div class='treeRow'>"+box("父亲",b.father)+box("母亲",b.mother)+"</div>";
  html += "<div class='treeRow'>"+
    box("祖父", f ? f.father : "") + box("祖母", f ? f.mother : "") +
    box("外祖父", m ? m.father : "") + box("外祖母", m ? m.mother : "") +
    "</div>";
  document.getElementById("tree").innerHTML = html;
}
function renderList(){
  var keys=Object.keys(birds);
  document.getElementById("count").innerHTML="共 " + keys.length + " 只";
  if(!keys.length){ document.getElementById("list").innerHTML="暂无数据"; return; }
  var html="";
  keys.forEach(function(r){
    var b=birds[r];
    html += "<div class='listItem'><span class='ring'>"+esc(r)+"</span> "+esc(b.name||"")+"<br><span class='muted'>父："+esc(b.father||"-")+" / 母："+esc(b.mother||"-")+"</span><br>"+
    "<button onclick='jump(\""+esc(r)+"\")'>查看</button><button class='gray' onclick='editBird(\""+esc(r)+"\")'>修改</button><button class='red' onclick='deleteBird(\""+esc(r)+"\")'>删除</button></div>";
  });
  document.getElementById("list").innerHTML=html;
}
function renderAll(){ renderResult(); renderTree(); renderList(); }

document.getElementById("search").addEventListener("keydown",function(e){ if(e.key==="Enter"){ queryBird(); } });
currentRing = Object.keys(birds)[0] || "";
renderAll();
</script>
</body>
</html>
