<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鸽棚血统管理</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#222;color:#fff;padding:12px;font-size:20px}
main{max-width:900px;margin:auto;padding:10px}
.card{background:#fff;padding:12px;margin:10px 0;border-radius:8px}
input,button{padding:8px;margin:5px 0;width:100%}
button{background:#222;color:#fff;border:none;border-radius:6px}
.box{border:1px solid #ccc;padding:8px;margin:5px}
</style>
</head>

<body>
<header>鸽棚血统管理</header>

<main>

<div class="card">
<input id="search" placeholder="输入足环号">
<button onclick="queryBird()">查询</button>
</div>

<div class="card">
<h3>查询结果</h3>
<div id="result">暂无数据</div>
</div>

<div class="card">
<h3>血统（简版）</h3>
<div id="tree"></div>
</div>

<div class="card">
<h3>新增鸽子</h3>

<input id="ring" placeholder="足环号（必填）">
<input id="name" placeholder="名字">
<input id="father" placeholder="父亲足环号">
<input id="mother" placeholder="母亲足环号">

<button onclick="saveBird()">保存</button>

</div>

</main>

<script>

var birds = JSON.parse(localStorage.getItem("birds") || "{}");

function save() {
  localStorage.setItem("birds", JSON.stringify(birds));
}

function saveBird() {
  var ring = document.getElementById("ring").value.trim();

  if (!ring) {
    alert("请输入足环号");
    return;
  }

  birds[ring] = {
    name: document.getElementById("name").value.trim(),
    father: document.getElementById("father").value.trim(),
    mother: document.getElementById("mother").value.trim()
  };

  save();

  alert("已保存：" + ring);

  document.getElementById("search").value = ring;
  queryBird();
}

function queryBird() {
  var ring = document.getElementById("search").value.trim();

  var b = birds[ring];

  if (!b) {
    document.getElementById("result").innerHTML = "未找到";
    document.getElementById("tree").innerHTML = "";
    return;
  }

  document.getElementById("result").innerHTML =
    "<b>足环号：</b>" + ring +
    "<br><b>名字：</b>" + b.name +
    "<br><b>父：</b> <a href='#' onclick='jump(\""+b.father+"\")'>"+b.father+"</a>" +
    "<br><b>母：</b> <a href='#' onclick='jump(\""+b.mother+"\")'>"+b.mother+"</a>";

  drawTree(ring);
}

function jump(ring){
  if(!ring) return;
  document.getElementById("search").value = ring;
  queryBird();
}

function drawTree(ring){
  var b = birds[ring];

  var father = birds[b.father] || {};
  var mother = birds[b.mother] || {};

  document.getElementById("tree").innerHTML =
    "<div class='box'><b>本鸽：</b>"+ring+" "+(b.name||"")+"</div>" +
    "<div class='box'><b>父：</b>"+(b.father||"-")+" "+(father.name||"")+"</div>" +
    "<div class='box'><b>母：</b>"+(b.mother||"-")+" "+(mother.name||"")+"</div>";
}

</script>

</body>
</html>
