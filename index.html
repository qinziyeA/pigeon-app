<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鸽棚血统管理</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#222;color:#fff;padding:12px;font-size:20px}
main{max-width:1000px;margin:auto;padding:10px}
.card{background:#fff;padding:12px;margin:10px 0;border-radius:8px}
input,button{padding:8px;margin:5px 0;width:100%}
button{background:#222;color:#fff;border:none;border-radius:6px}
.row{display:flex;gap:10px}
.box{border:1px solid #ccc;padding:8px;margin:5px;flex:1}
</style>
</head>

<body>
<header>鸽棚血统管理</header>

<main>

<div class="card">
<input id="search" placeholder="输入足环号">
<button onclick="queryBird()">查询</button>
<button onclick="exportData()">导出数据</button>
<input type="file" onchange="importData(event)">
</div>

<div class="card">
<h3>查询结果</h3>
<div id="result">暂无数据</div>
</div>

<div class="card">
<h3>血统图</h3>
<div id="tree"></div>
</div>

<div class="card">
<h3>新增鸽子</h3>

<input id="ring" placeholder="足环号">
<input id="name" placeholder="名字">
<input id="father" placeholder="父亲足环号">
<input id="mother" placeholder="母亲足环号">

<button onclick="saveBird()">保存</button>

</div>

</main>

<script>

var birds = JSON.parse(localStorage.getItem("birds") || "{}");

function save(){
localStorage.setItem("birds", JSON.stringify(birds));
}

function saveBird(){
var ring = document.getElementById("ring").value.trim();
if(!ring){alert("请输入足环号");return;}

birds[ring] = {
name: document.getElementById("name").value,
father: document.getElementById("father").value,
mother: document.getElementById("mother").value
};

save();
alert("已保存："+ring);

document.getElementById("search").value = ring;
queryBird();
}

function queryBird(){
var ring = document.getElementById("search").value.trim();
var b = birds[ring];

if(!b){
document.getElementById("result").innerHTML = "未找到";
document.getElementById("tree").innerHTML = "";
return;
}

document.getElementById("result").innerHTML =
"足环号："+ring+
"<br>名字："+b.name+
"<br>父：<a href='#' onclick='jump(\""+b.father+"\")'>"+b.father+"</a>"+
"<br>母：<a href='#' onclick='jump(\""+b.mother+"\")'>"+b.mother+"</a>";

drawTree(ring);
}

function jump(r){
if(!r) return;
document.getElementById("search").value = r;
queryBird();
}

function get(r){
return birds[r] || {};
}

function drawTree(r){
var b = get(r);

var f = get(b.father);
var m = get(b.mother);

var ff = get(f.father);
var fm = get(f.mother);
var mf = get(m.father);
var mm = get(m.mother);

document.getElementById("tree").innerHTML =

"<div class='row'>" +
  "<div class='box'>本鸽<br>"+r+" "+(b.name||"")+"</div>" +
"</div>" +

"<div class='row'>" +
  "<div class='box'>父<br>"+(b.father||"-")+" "+(f.name||"")+"</div>" +
  "<div class='box'>母<br>"+(b.mother||"-")+" "+(m.name||"")+"</div>" +
"</div>" +

"<div class='row'>" +
  "<div class='box'>祖父<br>"+(f.father||"-")+" "+(ff.name||"")+"</div>" +
  "<div class='box'>祖母<br>"+(f.mother||"-")+" "+(fm.name||"")+"</div>" +
  "<div class='box'>外祖父<br>"+(m.father||"-")+" "+(mf.name||"")+"</div>" +
  "<div class='box'>外祖母<br>"+(m.mother||"-")+" "+(mm.name||"")+"</div>" +
"</div>";
}

function exportData(){
var data = JSON.stringify(birds);
var blob = new Blob([data], {type:"application/json"});
var url = URL.createObjectURL(blob);

var a = document.createElement("a");
a.href = url;
a.download = "鸽棚备份.json";
a.click();
}

function importData(e){
var file = e.target.files[0];
var reader = new FileReader();

reader.onload = function(){
birds = JSON.parse(reader.result);
save();
alert("导入成功");
};

reader.readAsText(file);
}

</script>

</body>
</html>
