<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>鸽棚管理</title>
</head>

<body>

<h2>鸽棚管理</h2>

<input id="search" placeholder="输入足环号">
<button onclick="queryBird()">查询</button>

<hr>

<h3>查询结果</h3>
<div id="result">暂无数据</div>

<hr>

<h3>新增鸽子</h3>

<input id="ring" placeholder="足环号"><br>
<input id="name" placeholder="名字"><br>
<input id="father" placeholder="父亲足环号"><br>
<input id="mother" placeholder="母亲足环号"><br>

<button onclick="saveBird()">保存</button>

<script>
var birds = JSON.parse(localStorage.getItem("birds") || "{}");

function save() {
  localStorage.setItem("birds", JSON.stringify(birds));
}

function saveBird() {
  var ring = document.getElementById("ring").value.trim();

  if (!ring) {
    alert("请输入足环号");
    return;
  }

  birds[ring] = {
    name: document.getElementById("name").value.trim(),
    father: document.getElementById("father").value.trim(),
    mother: document.getElementById("mother").value.trim()
  };

  save();
  alert("已保存：" + ring);
}

function queryBird() {
  var ring = document.getElementById("search").value.trim();
  var b = birds[ring];

  if (!b) {
    document.getElementById("result").innerHTML = "未找到";
    return;
  }

  document.getElementById("result").innerHTML =
    "足环号：" + ring +
    "<br>名字：" + b.name +
    "<br>父：" + b.father +
    "<br>母：" + b.mother;
}
</script>

</body>
</html>
